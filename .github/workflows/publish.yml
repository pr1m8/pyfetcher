name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: |
          pdm sync -G dev -G docs -G db -G store -G text -G extractors \
            -G selectors -G media -G mcp

      - name: Validate release
        run: |
          pdm run ruff check src/ tests/ examples/
          pdm run ruff format --check src/ tests/ examples/
          pdm run pytest tests/ -q
          pdm run doc8 docs/
          LC_ALL=C pdm run sphinx-build -E -W --keep-going -b html docs/ docs/_build/html

      - name: Build package
        run: pdm build

      - name: Check package metadata
        run: pdm run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
